<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOSTMOROWALI.COM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f7f5] m-0 p-0">

<!-- 1. TOP BANNER - STICKY PALING ATAS -->
<div class="sticky top-0 z-[100] bg-[#111827]/95 backdrop-blur-md text-[11px] text-center text-[#facc15] font-bold py-2.5 tracking-widest uppercase border-b border-white/10">
  JARINGAN KOS & CARI TEMAN PATUNGAN MOROWALI • DEKAT IMIP
</div>

<!-- 2. HEADER LOGO - STICKY DI BAWAH BANNER -->
<div class="sticky top-[32px] z-[99] px-5 py-3.5 flex items-center gap-2.5 bg-[#fff6ff] border-b shadow-sm">
  <div class="w-8 h-8 bg-[#facc15] text-white rounded-[8px] flex items-center justify-center shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]">
      <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
      <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a1.5 1.5 0 00-1.5-1.5h-3a1.5 1.5 0 00-1.5 1.5v4.5A.75.75 0 017.5 21H5.625A1.875 1.875 0 013.75 19.125v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
    </svg>
  </div>
  <b class="text-[13px]">KOSMOROWALI.COM</b><span class="text-[10px] font-normal text-gray-500 tracking-wide hidden md:inline"> Powered by Naratama Investa Inc</span>
</div>

<!-- Hero Section -->
<div class="text-center pt-10 pb-6 px-4">
  <h1 class="text-[36px] font-extrabold leading-[1.05]">Kos Morowali Murah<br>Dekat IMIP IHIP GNI</h1>
  <button onclick="bukaPopupPatungan()" class="mt-4 bg-[#111111] text-white px-4 py-2 rounded-[8px] text-[11px] font-bold tracking-wide shadow-sm hover:bg-[#fde047] hover:text-black hover:scale-[1.03] active:scale-95 transition-all duration-200 cursor-pointer">
  👥 Cari Teman Patungan
</button>
</div>

<!-- 3. SEARCH BAR - STICKY DI BAWAH HEADER LOGO, GAK KEPOTONG LAGI -->
<div class="sticky top-[84px] z-[90] px-4 md:px-8 pb-4 bg-[#f4f7f5]/90 backdrop-blur-md pt-2">
  <div class="bg-white rounded-xl shadow-sm border p-1.5 flex items-center gap-1 max-w-5xl mx-auto overflow-visible">
    <div class="flex-1 flex items-center gap-2 px-3 min-w-0">
      <span class="shrink-0">📍</span>
      <input id="searchLocation" class="flex-1 py-2.5 text-[13px] outline-none bg-transparent min-w-0" placeholder="Bunta, Bahodopi...">
    </div>
    <select id="searchKM" class="shrink-0 text-[12px] font-medium px-2 py-2 outline-none bg-transparent border-l min-w-[110px]">
      <option value="all">Semua KM</option>
      <option value="km1">KM Luar</option>
      <option value="dalam">KM Dalam</option>
    </select>
    <button onclick="filterKos()" class="shrink-0 bg-[#111827] text-white px-6 py-2.5 rounded-[8px] font-bold text-[13px] hover:bg-[#FACC15] hover:text-black hover:scale-[1.05] active:scale-[0.95] transition-all duration-200 shadow-md hover:shadow-[0_0_20px_rgba(250,204,21,0.5)] cursor-pointer whitespace-nowrap">
  CARI KOS
</button>
  </div>
  <div class="max-w-5xl mx-auto mt-3 flex justify-between items-center">
    <h2 id="mainTitle" class="text-[13px] font-bold">Semua Kos</h2>
    <span id="resultCount" class="text-[11px] text-stone-500"></span>
  </div>
</div>

<!-- Main Grid -->
<div id="kosGrid" class="px-4 md:px-8 pb-24 grid md:grid-cols-3 gap-5 max-w-7xl mx-auto min-h-[400px]"></div>

<!-- Floating Patungan Button - UDAH GAK KUNING TAI LAGI -->
<div class="fixed bottom-[56px] right-3 z-[95]">
  <button onclick="bukaPopupPatungan()" class="bg-white border border-black text-black px-4 py-2.5 rounded-full shadow-lg text-[11px] font-bold hover:bg-[#16a34a] hover:text-white hover:border-[#16a34a] hover:scale-[1.05] hover:shadow-[0_0_20px_rgba(22,163,74,0.4)] active:scale-95 transition-all duration-200 cursor-pointer">
    👥 Cari Patungan
  </button>
</div>

<!-- Footer -->
<div class="fixed bottom-0 left-0 right-0 z-[90] bg-black text-white px-3 py-2.5 flex items-center justify-between gap-2 border-t border-stone-800">
  <h2 class="font-bold text-[11px] leading-[1.2] truncate">daftarkan kos anda gratis!</h2>
 <button onclick="bukaPopupKos()" class="shrink-0 bg-white text-black px-3.5 py-1.5 rounded text-[10px] font-bold hover:bg-[#FACC15] hover:text-black hover:scale-[1.05] hover:shadow-[0_0_15px_rgba(250,204,21,0.6)] active:scale-95 transition-all duration-200 cursor-pointer">
  daftar sekarang
</button>
</div>

<div class="h-[90px]"></div>
<div id="popupKos" class="hidden"></div>
<div id="popupPatungan" class="hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
