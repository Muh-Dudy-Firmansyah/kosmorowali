<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="app.js"></script>

<!-- SCRIPT PWA INSTALL - INI KUNCINYA -->
<script>
let deferredPrompt;
const bar = document.getElementById('installBar');
const btn = document.getElementById('installBtn');
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
function showBar(){ if(!isStandalone && bar) bar.style.display='flex'; }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; showBar(); });
setTimeout(() => { if(!isStandalone && bar && bar.style.display === 'none'){ showBar(); } }, 2000);
btn?.addEventListener('click', async () => {
  if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') bar.style.display = 'none'; deferredPrompt = null; }
  else { alert('Klik titik 3 di Chrome > Tambahkan ke Layar Utama'); }
});
window.addEventListener('appinstalled', () => { if(bar) bar.style.display = 'none'; });
</script>

</body>
